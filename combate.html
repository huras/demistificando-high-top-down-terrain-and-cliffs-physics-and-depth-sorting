<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena de combate</title>
  <link rel="stylesheet" href="css/combate.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topo">
    <a class="topo__voltar" href="index.html">Voltar ao jogo</a>
    <h1>Arena de combate</h1>
    <p class="topo__nota" id="status">Carregando catálogo…</p>
    <div class="topo__acoes">
    <div class="modo-luta" role="group" aria-label="Modo de luta">
      <button type="button" data-modo="real" class="ativo">Combate real</button>
      <button type="button" data-modo="turnos">Combate em turnos</button>
    </div>
    <div class="tempo" role="group" aria-label="Velocidade">
      <button type="button" data-tempo="0.5">0,5×</button>
      <button type="button" data-tempo="1" class="ativo">1×</button>
      <button type="button" data-tempo="2">2×</button>
    </div>
    <div class="nivel-ia" role="group" aria-label="Nível da IA">
      <button type="button" data-nivel="facil">Fácil</button>
      <button type="button" data-nivel="medio">Médio</button>
      <button type="button" data-nivel="dificil" class="ativo">Difícil</button>
    </div>
    <label class="topo__metade">
      Esquerda
      <select id="metade-esquerda" aria-label="Metade esquerda">
        <option value="normal">Normal</option>
        <option value="pedra">Pedra</option>
        <option value="planta">Planta</option>
      </select>
    </label>
    <label class="topo__metade">
      Direita
      <select id="metade-direita" aria-label="Metade direita">
        <option value="normal">Normal</option>
        <option value="pedra">Pedra</option>
        <option value="planta">Planta</option>
      </select>
    </label>
    <label class="topo__metade">
      Semente
      <input id="semente-cobertura" type="number" min="0" step="1" value="0" aria-label="Semente da cobertura">
    </label>
    <button type="button" id="arena-aleatoria">Aleatório</button>
    </div>
  </header>

  <div class="miolo">
    <aside class="coluna coluna--esq" id="lado-esquerda"></aside>
    <div class="palco">
      <canvas id="vista"></canvas>
      <div class="hud" id="hud">
        <div class="marca" data-marca="esquerda" hidden>
          <p class="marca__nome"></p>
          <div class="marca__vida">
            <div class="marca__barra"><span></span></div>
            <span class="marca__status" data-status hidden></span>
          </div>
          <div class="tubos" data-tubos hidden>
            <span class="tubos__nome">Ataque</span>
            <span class="tubos__trilho"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="marca__esquiva"><span></span></div>
        </div>
        <div class="marca" data-marca="direita" hidden>
          <p class="marca__nome"></p>
          <div class="marca__vida">
            <div class="marca__barra"><span></span></div>
            <span class="marca__status" data-status hidden></span>
          </div>
          <div class="tubos" data-tubos hidden>
            <span class="tubos__nome">Ataque</span>
            <span class="tubos__trilho"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="marca__esquiva"><span></span></div>
        </div>
      </div>
      <details class="log" id="log">
        <summary>Log <span class="log__n" id="log-n">0</span></summary>
        <ol id="log-lista"></ol>
      </details>
      <div class="turno" id="turno" hidden>
        <p class="turno__titulo" id="turno-titulo">Seu turno</p>
        <div class="turno__golpes" id="turno-golpes"></div>
      </div>
      <div class="luta">
        <button type="button" id="lutar" disabled>Lutar</button>
      </div>
    </div>
    <aside class="coluna coluna--dir" id="lado-direita"></aside>
  </div>

  <script type="module" src="js/combate/pagina.js"></script>
</body>
</html>
