<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pivô do Pokémon</title>
  <link rel="stylesheet" href="css/pivos.css" />
</head>
<body>
  <header class="topo">
    <a class="topo__voltar" href="index.html">Voltar ao jogo</a>
    <h1>Pivô e altura do chão</h1>
    <p class="topo__nota" id="status">Carregando catálogo…</p>
    <button type="button" id="salvar">Salvar</button>
  </header>

  <div class="miolo">
    <aside class="coluna">
      <section class="coluna__lista">
        <h2>Pokémon</h2>
        <input id="busca" type="search" placeholder="Nome ou número" />
        <ul class="lista lista--alta" id="lista-pokemon"></ul>
      </section>
      <section>
        <h2>Altura do chão</h2>
        <label class="campo">
          Células <strong id="offset-valor">0.00</strong>
          <input id="offset" type="range" min="-2" max="3" step="0.01" value="0" />
        </label>
        <p class="coords" id="coords">dx 0    dy 0</p>
        <h2>Pose</h2>
        <div class="faixas" id="faixas">
          <button type="button" data-faixa="Idle" class="ativo">Parado</button>
          <button type="button" data-faixa="Walk">Andando</button>
        </div>
        <div class="dirs" id="dirs">
          <button type="button" data-dir="3">NO</button>
          <button type="button" data-dir="4">N</button>
          <button type="button" data-dir="5">NE</button>
          <button type="button" data-dir="2">O</button>
          <span class="dirs__meio"></span>
          <button type="button" data-dir="6">L</button>
          <button type="button" data-dir="1">SO</button>
          <button type="button" data-dir="0" class="ativo">S</button>
          <button type="button" data-dir="7">SE</button>
        </div>
        <p class="nota">Arraste o desenho para pôr o pé na cruz. A cruz é o pivô. A altura desce (positivo) ou sobe esse ponto em relação à linha do chão. O mesmo pivô vale para parado e andando.</p>
      </section>
    </aside>
    <div class="palco">
      <canvas id="vista"></canvas>
    </div>
  </div>
  <script type="module" src="js/pivos/editor.js"></script>
</body>
</html>
