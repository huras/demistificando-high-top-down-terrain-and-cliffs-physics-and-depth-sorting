<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partículas</title>
  <link rel="stylesheet" href="css/particulas.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topo">
    <a class="topo__voltar" href="index.html">Voltar ao jogo</a>
    <h1>Partículas &amp; efeitos</h1>
    <p class="topo__nota" id="status">Carregando catálogo…</p>
    <div class="topo__acoes">
      <button type="button" id="reset-preset">Reset preset</button>
      <button type="button" id="salvar">Salvar</button>
    </div>
  </header>

  <div class="miolo">
    <aside class="coluna">
      <h2>Categoria</h2>
      <div class="abas" id="abas" role="tablist" aria-label="Categorias"></div>

      <h2>Presets</h2>
      <input id="busca" type="search" placeholder="Filtrar…" />
      <ul class="lista" id="lista"></ul>

      <h2>Parâmetros</h2>
      <div id="inspector"></div>

      <h2>Preview</h2>
      <div class="acoes-preview">
        <button type="button" id="disparar">Disparar</button>
        <button type="button" id="loop">Loop</button>
        <button type="button" id="limpar">Limpar</button>
      </div>
      <p class="nota">Aba <b>Efeitos</b> = projéteis/feixes + browser Elemental (rastro/impacto/orbe). Orbit: arrastar. Pan: botão direito. Salvar grava o JSON do jogo.</p>
    </aside>
    <div class="palco">
      <canvas id="vista"></canvas>
      <div class="hud-perf" id="hud-perf"></div>
    </div>
  </div>
  <script type="module" src="js/particulas/editor.js"></script>
</body>
</html>
