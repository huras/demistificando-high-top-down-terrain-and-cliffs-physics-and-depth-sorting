# Domínio: pokemon-wild-cry-3d.hurast.com
# Isolado do pokemon-wild-cry / pokemon-ai — não alterar aqueles vhosts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pokemon-wild-cry-3d.hurast.com;

    ssl_certificate /etc/letsencrypt/live/pokemon-wild-cry-3d.hurast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokemon-wild-cry-3d.hurast.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Editores locais ficam 404 na superfície pública.
    location = /biomas.html { return 404; }
    location = /faces.html { return 404; }
    location = /luzes.html { return 404; }
    location = /pivos.html { return 404; }
    location = /pivos-props.html { return 404; }
    location = /portas.html { return 404; }
    location = /colisores.html { return 404; }
    location = /marcar-centro.html { return 404; }
    location = /combate.html { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 2m;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name pokemon-wild-cry-3d.hurast.com;
    return 301 https://$host$request_uri;
}
